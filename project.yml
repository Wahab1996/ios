name: ClinicalNoteBuilder
options:
  bundleIdPrefix: com.fmclinical
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  ClinicalNoteBuilder:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    scheme: {}
    sources:
      - path: ClinicalNoteBuilder
        excludes:
          - Resources/Assets.xcassets/AppIcon.appiconset/README.txt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fmclinical.notebuilder
        PRODUCT_NAME: ClinicalNoteBuilder
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.8.0
        CURRENT_PROJECT_VERSION: 8
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    info:
      path: ClinicalNoteBuilder/Info.plist
      properties:
        CFBundleDisplayName: Clinical Note Builder
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
