name: Build Native iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Parse Swift sources
        run: |
          for f in $(find ClinicalNoteBuilder -name '*.swift' | sort); do
            xcrun swiftc -parse "$f"
          done

      - name: Build unsigned native IPA
        run: bash scripts/build_unsigned_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClinicalNoteBuilder-Native-IPA
          path: |
            ClinicalNoteBuilder-Native-unsigned.ipa
            ClinicalNoteBuilder-Native-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
